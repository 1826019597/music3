name: Build Android APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Install Gradle & Build
      timeout-minutes: 10
      run: |
        echo "🚀 开始编译..."
        ls -la
        
        # 1. 清理旧文件
        rm -f gradle.zip
        rm -rf gradle-8.0
        
        # 2. 下载 Gradle (阿里云镜像加速)
        echo "📥 下载 Gradle..."
        wget --timeout=30 -q https://mirrors.aliyun.com/gradle/gradle-8.0-bin.zip -O gradle.zip
        unzip -q gradle.zip
        export GRADLE_HOME=$PWD/gradle-8.0
        export PATH=$GRADLE_HOME/bin:$PATH
        
        # 3. 生成 Wrapper
        echo "🔧 生成 Gradle Wrapper..."
        gradle wrapper --gradle-version 8.0 --distribution-type all
        
        # 4. 授予权限并编译
        echo "🏗️ 编译 APK..."
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon --max-workers 2
        
    - name: Upload APK
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: app-debug.apk
        path: "**/debug/*.apk"

